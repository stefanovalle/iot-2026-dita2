# La configurazione del broker dell'aula. Dice poche cose:

# 1. ascolta MQTT sulla porta 1883...
listener 1883

# 2. ...e MQTT dentro i WebSocket sulla 9001, per i browser (giornata 4).
listener 9001
protocol websockets

# 3. accetta chiunque si colleghi, senza chiedere chi è.
#    Comodo in aula, un incidente in produzione: lo sistemiamo alla giornata 7.
allow_anonymous true
